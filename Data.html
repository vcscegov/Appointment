<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanamadevi CSC Appointments - Dynamic UI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }
        h2 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>

    <h2>Vanamadevi CSC Appointments</h2>
    <table id="appointmentsTable">
        <thead>
            <tr id="tableHeader">
                <th>Loading data...</th>
            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>

    <script>
        // Replace with your Google Sheet ID
        const SHEET_ID = '1m4Pq6I6kOy3qszzP-ON7xoX2KNGh7TYlEqg1EC7dIUM';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

        async function fetchSheetData() {
            try {
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                
                // Parse CSV rows
                const rows = csvText.split('\n').map(row => 
                    row.split(',').map(cell => cell.replace(/^"(.*)"$/, '$1').trim())
                );

                if (rows.length === 0) return;

                // Render Header
                const headerRow = rows[0];
                const headerHtml = headerRow.map(header => `<th>${header}</th>`).join('');
                document.getElementById('tableHeader').innerHTML = headerHtml;

                // Render Data Rows
                const dataRows = rows.slice(1);
                const bodyHtml = dataRows.map(row => {
                    return `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`;
                }).join('');
                document.getElementById('tableBody').innerHTML = bodyHtml;

            } catch (error) {
                console.error('Error fetching Google Sheet data:', error);
            }
        }

        // Fetch data on page load
        fetchSheetData();

        // Auto-refresh data every 10 seconds
        setInterval(fetchSheetData, 10000);
    </script>

</body>
</html>
